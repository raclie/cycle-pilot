name: 不具合・分かりにくい説明・提案 / Report or suggestion
description: 配布物への指摘や提案（秘密情報は書かないでください）
body:
  - type: markdown
    attributes:
      value: |
        **認証情報、個人情報、実際の業務データは書かないでください。** 脆弱性や、認証情報の混入を見つけた場合は、このIssueではなく、Securityタブの「Report a vulnerability」から報告してください。
        採用する場合は、開発元で取り込み、次の版として再生成します。返信や採用の時期は、お約束できません。
  - type: textarea
    id: content
    attributes:
      label: 内容 / Summary
      description: 何が起きた、何が分かりにくい、どうしてほしい。
    validations:
      required: true
  - type: textarea
    id: location
    attributes:
      label: 該当の場所 / Location
      description: ファイルと行、または手順の番号。
  - type: textarea
    id: steps
    attributes:
      label: 再現の手順 / Steps to reproduce
      description: 分かる範囲で。
  - type: input
    id: environment
    attributes:
      label: 環境 / Environment
      description: Node.jsのバージョン、OS。任意。
  - type: checkboxes
    id: consent
    attributes:
      label: 確認 / Confirmation
      options:
        - label: この内容を、本配布物と同じMIT Licenseで提供することに同意します。自分に権利のある内容だけを書きました。 / I agree to license this content under the same MIT License, and I only included content I have the right to share.
          required: true
        - label: 認証情報、個人情報、実際の業務データを含めていません。 / This contains no credentials, personal data, or real business data.
          required: true
